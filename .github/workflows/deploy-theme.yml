# Deploys theme/calcmycard/ to the live site whenever it changes on main.
#
# One-time setup (GitHub → repo Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (hPanel → Files → FTP Accounts)
#   Optional variables:
#     THEME_DIR     remote theme folder, default public_html/wp-content/themes/calcmycard/
#     FTP_PROTOCOL  ftps (default) or ftp
#
# Only changed files are uploaded; nothing on the server is deleted.
name: Deploy theme to calcmycard.com

on:
  push:
    branches: [main]
    paths:
      - 'theme/calcmycard/**'
      - '.github/workflows/deploy-theme.yml'
  workflow_dispatch:

concurrency:
  group: deploy-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: find theme/calcmycard -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Upload theme over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./theme/calcmycard/
          server-dir: ${{ vars.THEME_DIR || 'public_html/wp-content/themes/calcmycard/' }}
